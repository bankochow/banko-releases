name: iOS TestFlight

# Public free Actions: builds signed Banko Chow iOS from private banko-app and
# uploads to TestFlight. App source is never committed here.
#
# Run from the Actions tab (Run workflow). A push does not start it.
# Public macOS minutes are free within GitHub’s public-repo limits.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   BANKO_APP_READ_TOKEN              PAT or fine-grained token that can
#                                     read bankochow/banko-app (contents)
#   IOS_DISTRIBUTION_P12_BASE64       iOS Distribution .p12, base64
#   IOS_DISTRIBUTION_P12_PASSWORD     password for that .p12
#   IOS_PROVISION_PROFILE_BASE64      App Store .mobileprovision, base64
#   APP_STORE_CONNECT_KEY_ID          App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID       issuer id shown above the API keys
#   APP_STORE_CONNECT_KEY_P8_BASE64   the .p8 API key, base64
#
# Profile: App Store for com.bankochow.app, team Ade Studios LLC, same cert as
# the .p12. Prefer the older SHA1 .p12 format so the runner can import it.
# A browser login to App Store Connect is not enough for this job.

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: banko-app git ref to build (branch, tag, or SHA)
        required: true
        default: main

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: banko-app
    env:
      BANKO_APP_READ_TOKEN: ${{ secrets.BANKO_APP_READ_TOKEN }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
    steps:
      - name: Check secrets
        working-directory: .
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BANKO_APP_READ_TOKEN \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_PROVISION_PROFILE_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_P8_BASE64
          do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets listed at the top of .github/workflows/ios-testflight.yml on bankochow/banko-releases, then run again."
            exit 1
          fi
          IOS_BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 2))"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Secrets present. Marketing version stays 1.1. Build number is $IOS_BUILD_NUMBER. Ref: ${{ inputs.app_ref }}"

      - name: Check out private banko-app
        uses: actions/checkout@v6
        with:
          repository: bankochow/banko-app
          ref: ${{ inputs.app_ref }}
          token: ${{ secrets.BANKO_APP_READ_TOKEN }}
          path: banko-app

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: banko-app/package-lock.json

      - name: Build the web bundle and sync iOS
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install the distribution certificate and profile
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/banko-chow.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"

          echo "$IOS_DISTRIBUTION_P12_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/distribution.p12"

          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "Installed profile $PROFILE_NAME ($PROFILE_UUID) for team $TEAM_ID."

      - name: Archive
        run: |
          set -euo pipefail
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify)
          else
            formatter=(cat)
          fi
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BankoChow.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive | "${formatter[@]}"

      - name: Export the App Store package
        run: |
          set -euo pipefail
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bankochow.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify)
          else
            formatter=(cat)
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BankoChow.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | "${formatter[@]}"
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Exported $IPA"

      # No actions/upload-artifact: this repo is public and must not publish the IPA.

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          cp "$KEY_PATH" "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cd "$RUNNER_TEMP"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          rm -f "$KEY_PATH" "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Remove the temporary keychain
        if: always()
        working-directory: .
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
